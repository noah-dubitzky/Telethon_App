<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleSaver — Sign in</title><script src="https://cdn.tailwindcss.com"></script><script src="https://code.jquery.com/jquery-3.6.0.min.js"></script><script defer src="/scripts/auth.js"></script></head>
<body class="min-h-screen bg-gradient-to-b from-blue-50 to-blue-100 text-slate-900 flex items-center justify-center p-5"><main class="w-full max-w-md"><section class="bg-white rounded-3xl shadow-2xl p-6 sm:p-9"><div class="text-center mb-7"><img src="/assets/telesaver.png" alt="TeleSaver logo" class="w-16 h-16 rounded-2xl mx-auto mb-4 shadow"><h1 class="text-2xl font-bold">Welcome to TeleSaver</h1><p class="text-slate-500 mt-2">Sign in to view your Telegram archive.</p></div>
<div id="startupLoading" class="text-center text-slate-500 py-8" role="status">Checking your session…</div><div id="authPanel" class="hidden"><div class="grid grid-cols-2 bg-slate-100 rounded-xl p-1 mb-6" role="tablist"><button id="showLogin" class="rounded-lg py-2 font-semibold bg-white shadow" type="button">Log in</button><button id="showSignup" class="rounded-lg py-2 font-semibold text-slate-600" type="button">Sign up</button></div><div id="authMessage" class="hidden rounded-lg p-3 mb-4 text-sm" role="alert" aria-live="polite"></div>
<form id="loginForm" class="space-y-4"><label class="block"><span class="text-sm font-medium">Email</span><input name="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"></label><label class="block"><span class="text-sm font-medium">Password</span><input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"></label><button class="submit-button w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 disabled:opacity-60">Log in</button></form>
<form id="signupForm" class="hidden space-y-4"><label class="block"><span class="text-sm font-medium">Email</span><input name="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"></label><label class="block"><span class="text-sm font-medium">Password</span><input name="password" type="password" minlength="12" autocomplete="new-password" required class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"><span class="text-xs text-slate-500">Use at least 12 characters.</span></label><label class="block"><span class="text-sm font-medium">Confirm password</span><input name="confirmation" type="password" minlength="12" autocomplete="new-password" required class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"></label><button class="submit-button w-full rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 disabled:opacity-60">Create account</button></form></div></section></main></body></html>
