<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse received Telegram messages across all TeleSaver accounts." />
  <title>TeleSaver — All Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../scripts/session_guard.js"></script>
  <script defer src="../scripts/all_messages.js"></script>
  <script defer src="/scripts/sidebar.js"></script>
</head>
<body class="lg:!pl-64 min-h-screen bg-slate-50 text-slate-950 antialiased">
  <div id="appSidebar" class="contents"></div>

  <div class="min-h-screen ">
    <header class="sticky top-0 z-20 flex h-20 items-center gap-4 border-b border-slate-200 bg-white/95 px-5 backdrop-blur sm:px-8 lg:px-10">
      <a href="/desktop/index.html" class="flex items-center gap-2 lg:hidden" aria-label="TeleSaver dashboard">
        <img src="/assets/telesaver.png" alt="" class="h-9 w-9 rounded-lg" />
        <span class="font-bold">TeleSaver</span>
      </a>
      <a href="/settings.html" class="hidden min-w-0 items-center gap-3 rounded-xl px-2 py-1 transition hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500 lg:flex" aria-label="Open Accounts and Settings">
        <span data-user-initial aria-hidden="true" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-600 font-bold text-white">&hellip;</span>
        <span data-user-email class="max-w-64 truncate text-sm text-slate-500">Loading...</span>
      </a>
      <label class="relative ml-auto hidden w-full max-w-md md:block">
        <span class="sr-only">Search messages</span>
        <svg aria-hidden="true" class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-4-4"/></svg>
        <input id="messageSearch" type="search" placeholder="Search messages…" class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-11 pr-4 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10" />
      </label>
      <button id="openSidebar" type="button" class="ml-auto flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 text-sm font-bold text-white shadow-sm transition hover:bg-blue-700 md:ml-2" aria-label="Open account menu">
        <span data-user-initial aria-hidden="true">…</span>
      </button>
    </header>

    <main class="mx-auto w-full max-w-6xl px-5 py-8 sm:px-8 lg:px-10 lg:py-10">
      <div class="mb-7"><p class="text-sm font-semibold text-blue-600">Archive</p><h1 class="mt-1 text-3xl font-bold tracking-tight">All Messages</h1><p class="mt-2 text-slate-500">Received messages across all of your connected Telegram accounts.</p></div>

      <section class="overflow-hidden rounded-2xl border border-blue-200 bg-white shadow-sm" aria-labelledby="messagesHeading">
        <div class="flex items-center gap-4 border-b border-blue-200 bg-gradient-to-r from-blue-600 to-sky-500 px-5 py-5 text-white sm:px-6">
          <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white/15 ring-1 ring-inset ring-white/20"><svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v12H7l-3 3V5Z"/><path stroke-linecap="round" d="M8 9h8M8 13h5"/></svg></span>
          <div><h2 id="messagesHeading" class="text-lg font-bold">Messages</h2><p class="mt-1 text-sm text-blue-50">Newest received messages appear first.</p></div>
        </div>
        <div id="allMessages" class="divide-y divide-slate-100"></div>
        <div id="messagesLoading" class="p-8 text-center text-sm text-slate-500" role="status">Loading messages…</div>
        <p id="messagesEmpty" class="hidden p-8 text-center text-sm text-slate-500">No received messages have been archived yet.</p>
        <div id="messagesError" class="hidden p-6 text-center"><p class="text-sm text-red-600">Unable to load messages.</p><button id="retryMessages" type="button" class="mt-3 rounded-lg border border-red-200 px-4 py-2 text-sm font-semibold text-red-700 hover:bg-red-50">Try again</button></div>
        <p id="messagesEnd" class="hidden p-5 text-center text-xs font-medium text-slate-400">You’ve reached the end of the archive.</p>
      </section>
    </main>
  </div>
</body>
</html>
