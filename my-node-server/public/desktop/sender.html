<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Telesaver — Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/scripts/jquery-3.0.0.min.js"></script>
  <script src="../scripts/session_guard.js"></script>
  <script src="../scripts/messages_api.js"></script>
  <script src="../socket.io/socket.io.js"></script>
  <script src="../scripts/message_handling_helpers.js"></script>
  <script defer src="../scripts/socket_load_messages.js"></script>
  <script src="../scripts/Export_As_PDF_Helpers.js"></script>
  <script src="scripts/desktop_sidebar.js"></script>

</head>
<body class="h-screen overflow-hidden bg-[#dfe7ed] text-slate-950 antialiased">

  <!-- Top bar (centered logo + title, sticky, sidebar) -->
  <header class="sticky top-0 z-30 flex h-16 shrink-0 items-center justify-center border-b border-slate-200 bg-white px-6 text-slate-900 shadow-sm">
    <div class="grid grid-cols-[1fr_auto_1fr] items-center w-full">
      <div></div>
      <div class="flex items-center justify-center space-x-3">
        <img src="/assets/telesaver.png" alt="App Logo" class="h-10 w-10 rounded-xl shadow-sm" />
        <h1 class="text-2xl font-bold text-center">Telesaver — Messages</h1>
      </div>
      <div class="flex justify-end">
        <button id="openSidebar" class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-600 p-2 text-white shadow-sm transition hover:bg-blue-700" aria-label="Open account menu">
          <img src="/assets/SideBar.png" alt="Open Sidebar" class="h-9 w-9 shadow-md cursor-pointer hover:scale-105 transition-transform" />
        </button>
      </div>
    </div>
  </header>

  <!-- Content wrapper -->
  <main class="mx-auto flex h-[calc(100vh-4rem)] w-full max-w-6xl flex-col px-4 py-5 sm:px-6">
    <div class="mb-4 flex shrink-0 items-center justify-between gap-4 rounded-2xl border border-slate-200 bg-white px-5 py-4 shadow-sm">
      <div class="flex min-w-0 items-center space-x-3">
        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8a9 9 0 100-18 9 9 0 000 18z"/></svg>
        <div>
          <h2 class="truncate text-lg font-bold text-slate-900">
            Sender: <span id="sender-name" class="font-extrabold text-purple-700 drop-shadow">Loading...</span>
          </h2>
          <p class="hidden text-sm text-slate-500">
            Sender ID: <span id="sender-id">—</span>
          </p>
          <p class="mt-1 text-sm text-slate-500">
            Sender Phone: <span id="sender-phone">—</span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="download-messages" class="flex items-center rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-blue-300 hover:text-blue-700">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 4v12"/></svg>
          Download
        </button>
        <a id="account-back-link" href="/desktop/index.html" class="flex items-center bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow transition border border-blue-600">← Back to account</a>
      </div>
    </div>

    <!-- Messages list -->
    <section id="messages" class="min-h-0 flex-1 overflow-y-auto overscroll-contain rounded-2xl border border-slate-300/70 bg-[#dfe7ed] py-4 shadow-inner" style="background-image:radial-gradient(circle at 1px 1px,rgba(71,85,105,.16) 1px,transparent 0);background-size:24px 24px;">
      <div class="p-6 text-gray-500">Loading messages…</div>
      <div class="p-6 text-gray-500">Loading messages…</div>
      <!-- Match message view styling -->
      <!-- Add flex-1, overflow-y-scroll, min-h-0, px-2, pt-2, max-height -->
    </section>

  </main>

  <script>

    latest_sent_date = "00-00-0000";

    $('#download-messages').on('click', function() {

      exportChatAsPDF();

    });

    // --- page logic ---
    $(function(){
      (async function(){
      
      const senderId = Helpers.getQueryParam("id");
      const accountId = Helpers.getQueryParam("telegram_account_id");
      const senderPhone = Helpers.getQueryParam("phone");
      const external_id = Helpers.getQueryParam("external_id");
      const contextMessageId = Helpers.getQueryParam("message_id");

      const api = new MessagesAPI(); // our global API helper

      if(!senderId || !accountId){
        $("#messages").html(`<div class="p-6 text-red-500">Missing sender or Telegram account id.</div>`);
        return;
      }

      $("#account-back-link").attr("href", `/desktop/index.html?telegram_account_id=${encodeURIComponent(accountId)}`);

      $("#sender-id").text(external_id);
      $("#sender-phone").text(senderPhone || "—");

      try {
        let offset = 0;
        const contextResponse = contextMessageId
          ? await api.getMessageContext('sender', senderId, contextMessageId, accountId)
          : null;
        const rows = contextResponse
          ? contextResponse.messages
          : await api.getMessagesBySender(senderId, offset, accountId);
        const senderName = (rows && rows[0] && (rows[0].sender_name || rows[0].sender)) || "";
        $("#sender-name").text(senderName);

        const box = $("#messages");
        box.empty();
        if(!rows || rows.length === 0){
          box.html(`<div class="p-6 text-gray-500">No messages found for this sender.</div>`);
          return;
        }

        let loadedRows = contextResponse ? rows.slice() : rows.slice().reverse();
        loadedRows.forEach(m => box.append(renderMessage(m)));
        if (!contextResponse) offset += rows.length;

        let isLoading = false;
        let hasMore = !contextResponse && rows.length === 50;
        async function loadOlderMessages() {
          if (isLoading || !hasMore) return;
          isLoading = true;
          const oldScrollHeight = box[0].scrollHeight;
          try {
            const nextRows = await api.getMessagesBySender(senderId, offset, accountId);
            loadedRows = nextRows.slice().reverse().concat(loadedRows);
            latest_sent_date = "00-00-0000";
            box.empty();
            loadedRows.forEach(m => box.append(renderMessage(m)));
            offset += nextRows.length;
            hasMore = nextRows.length === 50;
            box[0].scrollTop = box[0].scrollHeight - oldScrollHeight;
          } catch (err) {
            console.error(err);
          } finally {
            isLoading = false;
          }
        }
        box.on('scroll', function () {
          if (this.scrollTop <= 10) loadOlderMessages();
        });
        if (contextResponse) {
          Helpers.focusMessage(contextMessageId);
          setTimeout(function () { Helpers.focusMessage(contextMessageId); }, 300);
          box.find('img,video').on('load loadeddata', function() {
            Helpers.focusMessage(contextMessageId);
          });
        } else {
          scrollMessagesToBottom();
          setTimeout(scrollMessagesToBottom, 300);
        }
      } catch (err) {
        $("#messages").html(`<div class="p-6 text-red-500">Failed to load messages.</div>`);
        console.error(err);
      }
      })();
    });
  
  </script>
</body>
</html>
